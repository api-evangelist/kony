name: Kony
description: >-
  Kony was a U.S. digital banking and low-code application platform company, best known for the Kony Quantum
  multiexperience development platform and the Kony DBX digital banking suite. Temenos acquired Kony and folded
  the digital banking business into Temenos Infinity and the Quantum platform into Temenos Quantum; non-banking
  Kony Quantum customers were transitioned to HCL Volt MX, managed by HCL Software. Kony no longer operates an
  independent developer program or public API. The kony.com apex and www hosts now redirect to the Temenos
  "Kony is now Temenos" announcement, docs.kony.com resolves to the Temenos Base Camp Quantum documentation, and
  only the authenticated Quantum Fabric Console at manage.kony.com is still served on the Kony domain. This
  profile is retained as an acquisition record pointing at its successors rather than as a live API provider.
